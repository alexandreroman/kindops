apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: loki
  namespace: kindops
spec:
  interval: 5m
  url: oci://registry-1.docker.io/bitnamicharts/grafana-loki
  ref:
    semver: "4.7.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: kindops
spec:
  releaseName: loki
  targetNamespace: loki
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: loki
    namespace: kindops
  values:
    fullnameOverride: loki
---
apiVersion: v1
kind: Namespace
metadata:
  name: loki
